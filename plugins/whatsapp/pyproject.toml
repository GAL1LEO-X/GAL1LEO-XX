[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-personal-bridge"
version = "0.8.13"
description = "Self-hosted WhatsApp archive and MCP bridge"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "GAL1LEO", email = "info@gal1leo.com"}]
dependencies = ["mcp==2.3.0", "PyJWT==2.15.1", "cryptography==50.0.2", "httpx==0.28.1", "uvicorn==0.54.0", "jsonschema==4.26.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
sally-whatsapp = "sally_whatsapp.cli:main"

[tool.setuptools.packages.find]
include = ["sally_whatsapp*"]

[tool.setuptools.package-data]
sally_whatsapp = ["operations.json", "assets/*.png", "assets/*.css", "assets/*.js", "migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]


[project.urls]
Repository = "https://github.com/GAL1LEO-X/GAL1LEO-XX"
Documentation = "https://github.com/GAL1LEO-X/GAL1LEO-XX/tree/main/plugins/whatsapp"
