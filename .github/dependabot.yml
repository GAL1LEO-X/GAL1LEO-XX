version: 2
updates:
  - package-ecosystem: pip
    directories:
      - /plugins/tesla
      - /plugins/whatsapp
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 2
    groups:
      same-python-dependency:
        group-by: dependency-name
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 2
    groups:
      weekly-updates:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 2
    groups:
      weekly-updates:
        patterns: ["*"]
